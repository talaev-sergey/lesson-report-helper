<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f0" />
    <meta name="description" content="Поиск и копирование отчетов о занятиях KIBERone." />
    <title>Отчеты уроков по модулям</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <header class="catalog-header">
        <h1>Отчеты по модулям</h1>
        <p>Выберите модуль и урок, затем скопируйте название или отчет</p>
        <label class="search-box" for="module-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.2 4.2"></path></svg>
          <input id="module-search" type="search" placeholder="Найти модуль..." autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <div class="catalog-count"><span id="module-count">—</span> модулей <i></i> <span id="lesson-total">—</span> уроков</div>
      </header>

      <nav class="module-list" id="module-list" aria-label="Список модулей"></nav>

      <footer class="credit" aria-label="Made by Codex">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 8 4.6v9.2l-8 4.6-8-4.6V7.4l8-4.6Z"></path><path d="m10 8.5-3 3.5 3 3.5M14 8.5l3 3.5-3 3.5"></path></svg>
        <span>Made by Codex</span>
      </footer>
    </aside>
    <script src="app.js" defer></script>
  </body>
</html>
